name: Build Dynamons Next (Linux x64)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/unity-web-visual-parity

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Build Unity player
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          # Omit UNITY_LICENSE so Unity 6 uses entitlement-based personal activation
          # rather than Hub .ulf file activation (which fails with Code 400 TimeStamp validation failed).
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneLinux64
          cliVersion: v0.1.77
          buildName: DynamonsNext
          buildsPath: build
          versioning: None

      - name: Package the Linux player
        run: |
          test -x build/StandaloneLinux64/DynamonsNext.x86_64
          test -f build/StandaloneLinux64/DynamonsNext_Data/il2cpp_data/Metadata/global-metadata.dat
          find build/StandaloneLinux64 -name 'GameAssembly.so' -print -quit | grep -q .
          test ! -d build/StandaloneLinux64/DynamonsNext_Data/MonoBleedingEdge
          tar -C build/StandaloneLinux64 -czf DynamonsNext-linux-x64.tar.gz .

      - name: Upload the build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DynamonsNext-linux-x64
          path: DynamonsNext-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Publish Linux build to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          ASSET="DynamonsNext-linux-x64.tar.gz"
          TITLE="Dynamons Next Builds (Latest)"
          NOTES="Automated IL2CPP Linux x64 and Android arm64-v8a builds (commit ${GITHUB_SHA::7})."
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" --title "$TITLE" --notes "$NOTES" || true
          fi
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 3
          done
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" || true
          gh release delete-asset "$TAG" "Dynamons2-linux-x64.tar.gz" -R "$GITHUB_REPOSITORY" -y >/dev/null 2>&1 || true
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"
