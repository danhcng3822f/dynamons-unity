name: Build & Release Dynamons Next

on:
  workflow_dispatch:
  push:
    branches:
      - feat/unity-web-visual-parity
      - main

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Compute build metadata
        id: meta
        run: |
          echo "version_name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Unity player (Linux x64)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          # Omit UNITY_LICENSE so Unity 6 uses entitlement-based personal activation
          # rather than Hub .ulf file activation (which fails with Code 400 TimeStamp validation failed).
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneLinux64
          cliVersion: v0.1.77
          buildName: DynamonsNext
          buildsPath: build
          versioning: Custom
          version: ${{ steps.meta.outputs.version_name }}

      - name: Verify and package Linux x64 player
        run: |
          test -x build/StandaloneLinux64/DynamonsNext.x86_64
          test -f build/StandaloneLinux64/DynamonsNext_Data/il2cpp_data/Metadata/global-metadata.dat
          find build/StandaloneLinux64 -name 'GameAssembly.so' -print -quit | grep -q .
          test ! -d build/StandaloneLinux64/DynamonsNext_Data/MonoBleedingEdge
          grep -qa 'Dynamons Next' build/StandaloneLinux64/DynamonsNext_Data/globalgamemanagers
          tar -C build/StandaloneLinux64 -czf DynamonsNext-linux-x64.tar.gz .

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DynamonsNext-linux-x64
          path: DynamonsNext-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Compute build metadata and verify signing secrets
        id: meta
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KA_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KA_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          for v in KS_B64 KS_PASS KA_NAME KA_PASS; do
            test -n "${!v}" || { echo "Missing required GitHub secret for $v"; exit 1; }
          done
          echo "version_name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build Android APK (IL2CPP arm64-v8a)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          cliVersion: v0.1.77
          buildName: DynamonsNext
          buildsPath: build
          versioning: Custom
          version: ${{ steps.meta.outputs.version_name }}
          androidVersionCode: ${{ steps.meta.outputs.version_code }}
          androidExportType: androidPackage
          androidSymbolType: none
          androidKeystoreName: DynamonsNext.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Remove temporary decoded keystore
        if: always()
        run: rm -f DynamonsNext.keystore

      - name: Verify Android APK (arm64-v8a, branding, version & signing)
        env:
          EXPECTED_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          EXPECTED_CERT_SHA256: d20a448a905a852203030f813bdb006f6b6fd254c4ca14c3da6751372eb4539f
        run: |
          test -f build/Android/DynamonsNext.apk
          unzip -l build/Android/DynamonsNext.apk | grep -q 'lib/arm64-v8a/libil2cpp.so'
          unzip -l build/Android/DynamonsNext.apk | grep -q 'lib/x86_64/libil2cpp.so'
          ! unzip -l build/Android/DynamonsNext.apk | grep -q 'lib/armeabi-v7a/'
          ! unzip -l build/Android/DynamonsNext.apk | grep -q 'lib/x86/'
          python3 - <<'PY'
          import hashlib, os, struct, subprocess, zipfile

          apk_path = 'build/Android/DynamonsNext.apk'
          expected_vname = os.environ['EXPECTED_VERSION_NAME']
          expected_vcode = int(os.environ['EXPECTED_VERSION_CODE'])
          expected_cert = os.environ['EXPECTED_CERT_SHA256'].lower()

          def read_manifest_attrs(data):
              u16 = lambda o: struct.unpack_from('<H', data, o)[0]
              u32 = lambda o: struct.unpack_from('<I', data, o)[0]
              strings, pos, fsize, out = [], 8, u32(4), {}
              while pos < len(data) and pos < fsize:
                  ctype, _, csz = u16(pos), u16(pos + 2), u32(pos + 4)
                  if ctype == 0x0001:
                      scount, _, flags, str_off = struct.unpack_from('<IIII', data, pos + 8)
                      utf8 = bool(flags & 0x100)
                      offsets = struct.unpack_from(f'<{scount}I', data, pos + 28)
                      base = pos + str_off
                      for off in offsets:
                          p = base + off
                          if utf8:
                              p += 1 if (data[p] & 0x80) == 0 else 2
                              blen = data[p]
                              if blen & 0x80:
                                  blen = ((blen & 0x7f) << 8) | data[p + 1]
                                  p += 2
                              else:
                                  p += 1
                              strings.append(data[p:p + blen].decode('utf-8', 'replace'))
                          else:
                              clen = u16(p); p += 2
                              if clen & 0x8000:
                                  clen = ((clen & 0x7fff) << 16) | u16(p); p += 2
                              strings.append(data[p:p + clen * 2].decode('utf-16le', 'replace'))
                  elif ctype == 0x0102:
                      nidx = u32(pos + 20)
                      if nidx < len(strings) and strings[nidx] == 'manifest':
                          astart, asize, acount = u16(pos + 24), u16(pos + 26), u16(pos + 28)
                          base = pos + 16 + astart
                          for i in range(acount):
                              ao = base + i * asize
                              an_idx, rv_idx = u32(ao + 4), u32(ao + 8)
                              v_type, v_data = data[ao + 15], struct.unpack_from('<i', data, ao + 16)[0]
                              an = strings[an_idx] if an_idx < len(strings) else ''
                              if rv_idx != 0xffffffff and rv_idx < len(strings):
                                  out[an] = strings[rv_idx]
                              elif v_type in (0x10, 0x11):
                                  out[an] = v_data
                  if csz == 0:
                      break
                  pos += csz
              return out

          def read_v2_v3_certs(path):
              blob = open(path, 'rb').read()
              eocd = blob.rfind(b'PK\x05\x06')
              cd_off = struct.unpack_from('<I', blob, eocd + 16)[0]
              assert blob[cd_off - 16:cd_off] == b'APK Sig Block 42', 'Missing APK Signature Scheme v2/v3 block'
              blk_size = struct.unpack_from('<Q', blob, cd_off - 24)[0]
              p = cd_off - 8 - blk_size + 8
              end = cd_off - 24
              certs = []
              while p < end:
                  plen = struct.unpack_from('<Q', blob, p)[0]; p += 8
                  pid = struct.unpack_from('<I', blob, p)[0]
                  pdata = blob[p + 4:p + plen]
                  if pid in (0x7109871a, 0xf05368c0):
                      slen_total = struct.unpack_from('<I', pdata, 0)[0]
                      sp = 4
                      while sp < 4 + slen_total:
                          slen = struct.unpack_from('<I', pdata, sp)[0]; sp += 4
                          sdata = pdata[sp:sp + slen]; sp += slen
                          sd_len = struct.unpack_from('<I', sdata, 0)[0]
                          sd = sdata[4:4 + sd_len]
                          dlen = struct.unpack_from('<I', sd, 0)[0]
                          clen = struct.unpack_from('<I', sd, 4 + dlen)[0]
                          cp = 4 + dlen + 4
                          while cp < 4 + dlen + 4 + clen:
                              c1len = struct.unpack_from('<I', sd, cp)[0]; cp += 4
                              certs.append(hashlib.sha256(sd[cp:cp + c1len]).hexdigest().lower())
                              cp += c1len
                  p += plen
              return certs

          with zipfile.ZipFile(apk_path) as z:
              man = z.read('AndroidManifest.xml')
              arsc = z.read('resources.arsc')
              ggm = z.read('assets/bin/Data/globalgamemanagers')
              man_text = man + man.replace(b'\x00', b'')
              arsc_text = arsc + arsc.replace(b'\x00', b'')
              assert b'com.dynamons.game' in man_text, 'Missing com.dynamons.game in AndroidManifest.xml'
              assert b'com.Dynamons.workspace' not in man_text, 'Unexpected workspace package ID'
              for perm in (
                  b'android.permission.INTERNET',
                  b'android.permission.ACCESS_NETWORK_STATE',
                  b'android.permission.ACCESS_WIFI_STATE',
                  b'android.permission.CHANGE_WIFI_MULTICAST_STATE',
              ):
                  assert perm in man_text, f'Missing {perm.decode()} in AndroidManifest.xml'
              assert b'Dynamons Next' in arsc_text, 'Missing Dynamons Next app name in resources.arsc'
              assert b'Dynamons Next' in ggm, 'Missing Dynamons Next productName in globalgamemanagers'
              attrs = read_manifest_attrs(man)
              print('Parsed manifest attrs:', attrs)
              assert attrs.get('package') == 'com.dynamons.game', f'Unexpected package: {attrs}'
              assert attrs.get('versionCode') == expected_vcode and expected_vcode > 1, f'Expected versionCode {expected_vcode}, got {attrs}'
              assert attrs.get('versionName') == expected_vname, f'Expected versionName {expected_vname}, got {attrs}'
              v1_files = [n for n in z.namelist() if n.startswith('META-INF/') and (n.endswith('.RSA') or n.endswith('.DSA') or n.endswith('.EC'))]
              for vf in v1_files:
                  pem = subprocess.check_output(['openssl', 'pkcs7', '-inform', 'DER', '-print_certs'], input=z.read(vf))
                  fp_out = subprocess.check_output(['openssl', 'x509', '-noout', '-fingerprint', '-sha256'], input=pem).decode('utf-8', 'replace')
                  subj_out = subprocess.check_output(['openssl', 'x509', '-noout', '-subject'], input=pem).decode('utf-8', 'replace')
                  assert 'Android Debug' not in subj_out, f'Ephemeral debug certificate detected in {vf}: {subj_out}'
                  fp_hex = fp_out.split('=', 1)[1].strip().replace(':', '').lower()
                  assert fp_hex == expected_cert, f'v1 cert mismatch in {vf}: {fp_hex} != {expected_cert}'

          v23_certs = read_v2_v3_certs(apk_path)
          print('Parsed v2/v3 cert SHA256:', v23_certs)
          assert len(v23_certs) > 0 and all(c == expected_cert for c in v23_certs), f'v2/v3 cert mismatch: {v23_certs}'
          PY
          cp build/Android/DynamonsNext.apk DynamonsNext-android-arm64.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DynamonsNext-android-arm64
          path: DynamonsNext-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-linux, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download Linux build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DynamonsNext-linux-x64

      - name: Download Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DynamonsNext-android-arm64

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f DynamonsNext-linux-x64.tar.gz
          test -f DynamonsNext-android-arm64.apk
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
             gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            TAG="v1.0.${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          COMMIT_MSG=$(git log -1 --pretty=%s "$GITHUB_SHA" 2>/dev/null || echo "Automated build")
          TITLE="Dynamons Next ${TAG} (${GITHUB_SHA::7})"
          NOTES=$(printf 'Automated IL2CPP builds for commit `%s`.\n\n- **Commit**: %s\n- **Android**: `DynamonsNext-android-arm64.apk` (arm64-v8a + x86_64 IL2CPP)\n- **Linux**: `DynamonsNext-linux-x64.tar.gz` (x64 IL2CPP)' "${GITHUB_SHA::7}" "$COMMIT_MSG")
          gh release create "$TAG" \
            DynamonsNext-android-arm64.apk \
            DynamonsNext-linux-x64.tar.gz \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --generate-notes \
            --latest
