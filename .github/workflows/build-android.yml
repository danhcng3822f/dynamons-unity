name: Build Dynamons 2 (Android arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/unity-web-visual-parity

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Build Android APK (IL2CPP arm64-v8a)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          # Omit UNITY_LICENSE so Unity 6 uses entitlement-based personal activation.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          cliVersion: v0.1.77
          buildName: Dynamons2
          buildsPath: build
          versioning: None
          androidExportType: androidPackage
          androidSymbolType: none

      - name: Verify the Android APK (arm64-v8a)
        run: |
          test -f build/Android/Dynamons2.apk
          unzip -l build/Android/Dynamons2.apk | grep -q 'lib/arm64-v8a/libil2cpp.so'
          ! unzip -l build/Android/Dynamons2.apk | grep -q 'lib/armeabi-v7a/'
          ! unzip -l build/Android/Dynamons2.apk | grep -q 'lib/x86'
          cp build/Android/Dynamons2.apk Dynamons2-android-arm64.apk

      - name: Upload the Android APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Dynamons2-android-arm64
          path: Dynamons2-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          ASSET="Dynamons2-android-arm64.apk"
          TITLE="Dynamons 2 Builds (Latest)"
          NOTES="Automated IL2CPP Linux x64 and Android arm64-v8a builds (commit ${GITHUB_SHA::7})."
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" --title "$TITLE" --notes "$NOTES" || true
          fi
          for attempt in 1 2 3; do
            if gh release upload "$TAG" "$ASSET" -R "$GITHUB_REPOSITORY" --clobber; then
              break
            fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 3
          done
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" || true
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$ASSET"
